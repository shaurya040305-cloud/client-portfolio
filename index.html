<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Professional Showcase</title>
    <style>
        /* This makes the PDF fill the entire browser window */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #333; /* A dark background for a clean look */
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Mobile fallback message */
        .mobile-note {
            display: none;
            text-align: center;
            padding: 20px;
            color: white;
            font-family: sans-serif;
        }

        @media (max-width: 600px) {
            .mobile-note { display: block; }
        }
    </style>
</head>
<body>
    <!-- The #view=FitH makes the PDF fit the width automatically -->
    <iframe src="portfolio.pdf#toolbar=0&navpanes=0&scrollbar=1&view=FitH">
        <p>Your browser does not support iframes. 
           <a href="portfolio.pdf">Click here to view the portfolio.</a>
        </p>
    </iframe>
</body>
</html>
